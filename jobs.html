<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1c3a5e">
  <title>Jobs — SHW</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login guard -->
  <div class="login-screen" id="loginScreen">
    <div class="login-logo">🏠 Seattle Home Windows</div>
    <div class="login-sub">Glass Order Management</div>
    <div class="pin-input-group">
      <input type="tel" class="pin-digit" maxlength="1" data-pin="0" inputmode="numeric" autofocus>
      <input type="tel" class="pin-digit" maxlength="1" data-pin="1" inputmode="numeric">
      <input type="tel" class="pin-digit" maxlength="1" data-pin="2" inputmode="numeric">
      <input type="tel" class="pin-digit" maxlength="1" data-pin="3" inputmode="numeric">
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" id="loginBtn">Unlock</button>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-brand">🏠 Seattle Home Windows</div>
    <div class="header-title">Jobs</div>
  </header>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="jobSearch" placeholder="Search jobs...">
    </div>
  </div>

  <!-- Job list -->
  <div class="content" id="jobList">
    <div class="loading-state" id="loadingState">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading jobs...</div>
    </div>
  </div>

  <!-- Job Detail Modal -->
  <div class="modal-overlay" id="jobModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Job Details</div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="jobs.html" class="nav-item active">
      <span class="nav-icon">📋</span>
      Jobs
    </a>
    <a href="new-order.html" class="nav-item">
      <span class="nav-icon">➕</span>
      New Order
    </a>
    <a href="work-order.html" class="nav-item">
      <span class="nav-icon">🔧</span>
      Work Orders
    </a>
  </nav>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
  <script>
    if (localStorage.getItem('shw_auth') === 'true') {
      document.getElementById('loginScreen').classList.add('hidden');
      initJobs();
    }
  </script>
</body>
</html>
