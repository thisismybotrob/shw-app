<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Jobs — SHW</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1c3a5e">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-header">
    <h1>🪟 Jobs</h1>
  </div>

  <div class="container">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search jobs...">
    </div>
    <div id="jobsList">
      <div class="loading">Loading jobs...</div>
    </div>
  </div>

  <button class="fab" onclick="location.href='new-quote.html'">+</button>

  <nav class="bottom-nav">
    <a href="jobs.html" class="nav-item active">
      <span class="nav-icon">📋</span>Jobs
    </a>
    <a href="new-quote.html" class="nav-item">
      <span class="nav-icon">📝</span>Quote
    </a>
    <a href="work-order.html" class="nav-item">
      <span class="nav-icon">🔧</span>Work Orders
    </a>
  </nav>

  <script src="pricing.js"></script>
  <script src="ghl.js"></script>
  <script src="app.js"></script>
  <script>
    if (!checkAuth()) throw 'no auth';

    let allOpps = [];
    let pipeline = null;

    async function loadJobs() {
      const list = document.getElementById('jobsList');
      try {
        pipeline = await GHL.ensurePipeline();
        if (!pipeline) {
          list.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><h3>No pipeline found</h3><p>Set up a Jobs pipeline in GHL first</p></div>';
          return;
        }
        allOpps = await GHL.getOpportunities(pipeline.id);
        renderJobs(allOpps);
      } catch (e) {
        console.error(e);
        list.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><h3>Error loading jobs</h3><p>' + e.message + '</p></div>';
      }
    }

    function getStageInfo(stageId) {
      if (!pipeline) return { name: 'Unknown', color: '#95a5a6' };
      const stage = pipeline.stages.find(s => s.id === stageId);
      if (!stage) return { name: 'Unknown', color: '#95a5a6' };
      return { name: stage.name, color: GHL.getStageColor(stage.name) };
    }

    function renderJobs(opps) {
      const list = document.getElementById('jobsList');
      if (!opps.length) {
        list.innerHTML = '<div class="empty-state"><div class="icon">📋</div><h3>No jobs yet</h3><p>Tap + to create your first quote</p></div>';
        return;
      }
      list.innerHTML = opps.map(opp => {
        const stage = getStageInfo(opp.pipelineStageId);
        const value = opp.monetaryValue ? formatCurrency(opp.monetaryValue) : '';
        return `
          <div class="job-card" onclick="openJob('${opp.id}')">
            <div class="job-info">
              <h3>${opp.name || 'Unnamed'}</h3>
              <p>${value}</p>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="badge" style="background:${stage.color}">${stage.name}</span>
              <span class="job-arrow">›</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function openJob(id) {
      window.location.href = `job-detail.html?id=${id}`;
    }

    // Search
    document.getElementById('searchInput').addEventListener('input', debounce(function() {
      const q = this.value.toLowerCase().trim();
      if (!q) { renderJobs(allOpps); return; }
      const filtered = allOpps.filter(o => (o.name || '').toLowerCase().includes(q));
      renderJobs(filtered);
    }, 200));

    loadJobs();
  </script>
</body>
</html>
