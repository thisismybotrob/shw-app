<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Work Orders — SHW</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1c3a5e">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-header">
    <h1>🔧 Work Orders</h1>
  </div>

  <div class="container">
    <div id="woList"><div class="loading">Loading work orders...</div></div>
  </div>

  <nav class="bottom-nav">
    <a href="jobs.html" class="nav-item">
      <span class="nav-icon">📋</span>Jobs
    </a>
    <a href="new-quote.html" class="nav-item">
      <span class="nav-icon">📝</span>Quote
    </a>
    <a href="work-order.html" class="nav-item active">
      <span class="nav-icon">🔧</span>Work Orders
    </a>
  </nav>

  <script src="pricing.js"></script>
  <script src="ghl.js"></script>
  <script src="app.js"></script>
  <script>
    if (!checkAuth()) throw 'no auth';

    // Check if loading a specific job
    const singleId = new URLSearchParams(location.search).get('id');

    async function loadWorkOrders() {
      const list = document.getElementById('woList');

      try {
        const pipeline = await GHL.ensurePipeline();
        if (!pipeline) { list.innerHTML = '<div class="empty-state"><h3>No pipeline found</h3></div>'; return; }

        let opps = [];

        if (singleId) {
          // Load single job as work order
          const result = await GHL.getOpportunity(singleId);
          const opp = result.opportunity || result;
          opps = [opp];
        } else {
          // Find "Job Scheduled" stage
          const scheduledStage = pipeline.stages.find(s => /job.*schedul/i.test(s.name));
          if (!scheduledStage) {
            // Show all active jobs
            opps = await GHL.getOpportunities(pipeline.id);
            opps = opps.filter(o => o.status === 'open');
          } else {
            opps = await GHL.getOpportunities(pipeline.id);
            opps = opps.filter(o => o.pipelineStageId === scheduledStage.id);
          }
        }

        if (!opps.length) {
          list.innerHTML = '<div class="empty-state"><div class="icon">🔧</div><h3>No work orders</h3><p>Jobs in "Job Scheduled" stage appear here</p></div>';
          return;
        }

        // Find "Job Complete" stage
        const completeStage = pipeline.stages.find(s => /job.*complete/i.test(s.name) || /complete/i.test(s.name));

        list.innerHTML = opps.map(opp => {
          const quoteData = loadQuoteData('quote_' + opp.id);
          const customer = quoteData ? quoteData.customer : {};
          const addr = customer.address || '';
          const mapsUrl = addr ? `https://maps.apple.com/?q=${encodeURIComponent(addr)}` : '#';

          let specsHtml = '';
          if (quoteData && quoteData.units) {
            const totals = calcQuoteTotal(quoteData.units);
            specsHtml = totals.lines.map((l, i) => `
              <div style="padding:6px 0;border-bottom:1px solid var(--blue-gray);font-size:13px;">
                <strong>${l.location || 'Unit ' + (i+1)}</strong>:
                ${formatDimension(l.widthWhole, l.widthFrac)} × ${formatDimension(l.heightWhole, l.heightFrac)}
                — ${l.glassType}, ${l.frameType}
                ${l.hasGrids ? '+ Grids' : ''} ${l.needsTemplate ? '+ Template' : ''}
                (×${l.qty})
              </div>
            `).join('');
          }

          const notes = (quoteData && quoteData.notes) || '';

          return `
            <div class="wo-card">
              <div class="wo-customer">${opp.name || 'Unknown'}</div>
              <a href="${mapsUrl}" class="wo-address" target="_blank">📍 ${addr || 'No address'}</a>
              <div class="wo-specs">${specsHtml}</div>
              ${notes ? `<div style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">📝 ${notes}</div>` : ''}
              ${completeStage ? `<button class="btn btn-success btn-sm" onclick="markComplete('${opp.id}','${completeStage.id}')">✓ Mark Complete</button>` : ''}
            </div>
          `;
        }).join('');
      } catch (e) {
        console.error(e);
        list.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Error</h3><p>${e.message}</p></div>`;
      }
    }

    async function markComplete(oppId, stageId) {
      showToast('Updating...');
      try {
        await GHL.updateOpportunity(oppId, { pipelineStageId: stageId });
        showToast('Marked Complete ✓');
        setTimeout(() => loadWorkOrders(), 1000);
      } catch (e) {
        showToast('Error: ' + e.message);
      }
    }

    loadWorkOrders();
  </script>
</body>
</html>
