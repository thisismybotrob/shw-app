<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Job Detail — SHW</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1c3a5e">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-header">
    <a href="jobs.html" class="back-btn">‹</a>
    <h1>Job Detail</h1>
    <div></div>
  </div>

  <div class="container">
    <div id="content"><div class="loading">Loading job...</div></div>
  </div>

  <nav class="bottom-nav">
    <a href="jobs.html" class="nav-item active">
      <span class="nav-icon">📋</span>Jobs
    </a>
    <a href="new-quote.html" class="nav-item">
      <span class="nav-icon">📝</span>Quote
    </a>
    <a href="work-order.html" class="nav-item">
      <span class="nav-icon">🔧</span>Work Orders
    </a>
  </nav>

  <script src="pricing.js"></script>
  <script src="ghl.js"></script>
  <script src="app.js"></script>
  <script>
    if (!checkAuth()) throw 'no auth';

    const oppId = new URLSearchParams(location.search).get('id');
    let pipeline = null;
    let opp = null;

    async function loadJob() {
      const content = document.getElementById('content');
      if (!oppId) { content.innerHTML = '<div class="empty-state"><h3>No job ID</h3></div>'; return; }

      try {
        pipeline = await GHL.ensurePipeline();
        const result = await GHL.getOpportunity(oppId);
        opp = result.opportunity || result;

        // Load local quote data
        const quoteData = loadQuoteData('quote_' + oppId);

        const currentStage = pipeline ? pipeline.stages.find(s => s.id === opp.pipelineStageId) : null;

        let html = '';

        // Customer info
        html += '<div class="card">';
        html += `<div class="card-header"><span class="card-title">Customer</span></div>`;
        html += `<div class="detail-row"><span class="detail-label">Name</span><span class="detail-value">${opp.name || 'Unknown'}</span></div>`;
        if (opp.contact) {
          html += `<div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value"><a href="tel:${opp.contact.phone || ''}">${opp.contact.phone || '—'}</a></span></div>`;
          html += `<div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">${opp.contact.email || '—'}</span></div>`;
        }
        if (quoteData && quoteData.customer) {
          html += `<div class="detail-row"><span class="detail-label">Address</span><span class="detail-value">${quoteData.customer.address || '—'}</span></div>`;
          html += `<div class="detail-row"><span class="detail-label">PO#</span><span class="detail-value">${quoteData.customer.po || '—'}</span></div>`;
        }
        html += `<div class="detail-row"><span class="detail-label">Value</span><span class="detail-value">${opp.monetaryValue ? formatCurrency(opp.monetaryValue) : '—'}</span></div>`;
        html += '</div>';

        // Pipeline stage selector
        if (pipeline) {
          html += '<div class="card"><div class="card-header"><span class="card-title">Pipeline Stage</span></div>';
          html += '<div class="stage-pills">';
          pipeline.stages.forEach(s => {
            const active = s.id === opp.pipelineStageId ? 'active' : '';
            const color = GHL.getStageColor(s.name);
            html += `<div class="stage-pill ${active}" style="background:${color}" onclick="changeStage('${s.id}','${s.name}')">${s.name}</div>`;
          });
          html += '</div></div>';
        }

        // Glass units from local data
        if (quoteData && quoteData.units && quoteData.units.length) {
          html += '<div class="section-header">Glass Units</div>';
          const totals = calcQuoteTotal(quoteData.units);
          totals.lines.forEach((line, i) => {
            html += `<div class="card">`;
            html += `<div class="card-header"><span class="card-title">${line.location || 'Unit ' + (i+1)}</span><span style="font-weight:700;color:var(--success);">${formatCurrency(line.lineTotal)}</span></div>`;
            html += `<div class="detail-row"><span class="detail-label">Size</span><span class="detail-value">${formatDimension(line.widthWhole, line.widthFrac)} × ${formatDimension(line.heightWhole, line.heightFrac)}</span></div>`;
            html += `<div class="detail-row"><span class="detail-label">Glass</span><span class="detail-value">${line.glassType}</span></div>`;
            html += `<div class="detail-row"><span class="detail-label">Frame</span><span class="detail-value">${line.frameType}</span></div>`;
            if (line.hasGrids) html += `<div class="detail-row"><span class="detail-label">Grids</span><span class="detail-value">${line.gridColor || ''} ${line.gridPattern || ''}</span></div>`;
            if (line.needsTemplate) html += `<div class="detail-row"><span class="detail-label">Template</span><span class="detail-value">Yes (+$200)</span></div>`;
            html += `<div class="detail-row"><span class="detail-label">Qty</span><span class="detail-value">${line.qty}</span></div>`;
            if (line.notes) html += `<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-value">${line.notes}</span></div>`;
            html += '</div>';
          });

          // Summary
          html += `<div class="summary-card">`;
          html += `<div class="summary-row sub"><span>Subtotal</span><span>${formatCurrency(totals.subtotal)}</span></div>`;
          html += `<div class="summary-row sub"><span>Tax (9.5%)</span><span>${formatCurrency(totals.tax)}</span></div>`;
          html += `<div class="summary-row total"><span>Total</span><span>${formatCurrency(totals.total)}</span></div>`;
          html += `<div class="summary-row sub"><span>Deposit (50%)</span><span>${formatCurrency(totals.deposit)}</span></div>`;
          html += `<div class="summary-row sub"><span>Balance Due</span><span>${formatCurrency(totals.balance)}</span></div>`;
          html += '</div>';
        }

        // Notes
        html += '<div class="card"><div class="card-header"><span class="card-title">Notes</span></div>';
        html += `<textarea class="form-textarea" id="jobNotes" rows="3" placeholder="Add notes...">${opp.notes || (quoteData && quoteData.notes) || ''}</textarea>`;
        html += `<button class="btn btn-sm btn-outline" onclick="saveNotes()" style="margin-top:8px;">Save Notes</button>`;
        html += '</div>';

        // Actions
        html += '<div class="actions-grid">';
        html += `<button class="btn btn-primary btn-sm" onclick="location.href='work-order.html?id=${oppId}'">🔧 Work Order</button>`;
        html += `<button class="btn btn-outline btn-sm" onclick="copyJobQuote()">📋 Copy Quote</button>`;
        html += '</div>';
        html += '<div style="height:20px;"></div>';

        content.innerHTML = html;
      } catch (e) {
        console.error(e);
        content.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Error loading job</h3><p>${e.message}</p></div>`;
      }
    }

    async function changeStage(stageId, stageName) {
      showToast('Updating stage...');
      try {
        await GHL.updateOpportunity(oppId, { pipelineStageId: stageId });
        showToast(`Moved to ${stageName} ✓`);
        loadJob();
      } catch (e) {
        showToast('Error: ' + e.message);
      }
    }

    async function saveNotes() {
      const notes = document.getElementById('jobNotes').value;
      try {
        // Save locally
        const quoteData = loadQuoteData('quote_' + oppId) || {};
        quoteData.notes = notes;
        saveQuoteData('quote_' + oppId, quoteData);
        showToast('Notes saved ✓');
      } catch (e) {
        showToast('Error saving notes');
      }
    }

    function copyJobQuote() {
      const quoteData = loadQuoteData('quote_' + oppId);
      if (!quoteData) { showToast('No quote data saved'); return; }
      const totals = calcQuoteTotal(quoteData.units);
      const text = formatQuoteText(quoteData.customer, quoteData.units, totals);
      navigator.clipboard.writeText(text).then(() => showToast('Copied! ✓')).catch(() => showToast('Copy failed'));
    }

    loadJob();
  </script>
</body>
</html>
